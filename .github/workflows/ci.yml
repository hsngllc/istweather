name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint, tip kontrolü ve testler
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_DB: hava_test
          POSTGRES_USER: hava
          POSTGRES_PASSWORD: hava_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hava -d hava_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      HAVA_DATABASE_URL: postgresql+psycopg://hava:hava_ci_only@localhost:5432/hava_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest (birim + TimescaleDB entegrasyon; ağ testleri kapalı)
        run: pytest -v

  compose-smoke:
    name: docker compose up + /health
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: .env (yalnız CI değerleri)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=hava_ci_only/' .env
      - name: docker compose up
        run: docker compose up -d --build
      - name: /api/v1/health bekle
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health -o health.json; then
              cat health.json
              python3 -c "import json; b = json.load(open('health.json')); assert b['database']['ok'], b"
              exit 0
            fi
            sleep 5
          done
          echo "health uç noktası 5 dakikada hazır olmadı"
          exit 1
      - name: worker kalp atışı
        run: |
          for i in $(seq 1 24); do
            curl -fsS http://127.0.0.1:8000/api/v1/health | grep -q '"worker"' && exit 0
            sleep 5
          done
          exit 1
      - name: Loglar
        if: always()
        run: docker compose logs --no-color
      - name: Temizlik
        if: always()
        run: docker compose down -v
