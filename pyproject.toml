[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hava"
version = "0.1.0"
description = "İstanbul çok modelli hava tahmini backend'i"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    # eccodeslib ikili paketi libaec'li gelir (DWD/Météo-France CCSDS); sistem kurulumu gerekmez.
    "eccodes>=2.50",
    "fastapi>=0.115",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    # ICON üçgen ızgarasında nokta çıkarımı (Delaunay, KD-ağacı)
    "scipy>=1.13",
    "sqlalchemy>=2.0.30",
    "structlog>=24",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.7",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hava"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Açıklamalar ve mesajlar Türkçe (spec §3); Türkçe harfler "belirsiz Unicode" sayılmasın.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic oluşturucusunun ürettiği tablo tanımları
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hava"]

[[tool.mypy.overrides]]
module = ["h5py.*", "h5netcdf.*", "pyarrow.*", "apscheduler.*", "eccodes.*", "gribapi.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: ağ erişimi gerektiren testler (CI'da varsayılan olarak kapalı)",
    "integration: TimescaleDB gerektiren testler (HAVA_DATABASE_URL yoksa atlanır)",
]
addopts = "-m 'not network'"
