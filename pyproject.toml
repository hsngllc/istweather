[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hava"
version = "0.1.0"
description = "İstanbul çok modelli hava tahmini backend'i"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.11",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyarrow>=17",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.7",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hava"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Açıklamalar ve mesajlar Türkçe (spec §3); Türkçe harfler "belirsiz Unicode" sayılmasın.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hava"]

[[tool.mypy.overrides]]
module = ["h5py.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: ağ erişimi gerektiren testler (CI'da varsayılan olarak kapalı)"]
addopts = "-m 'not network'"
